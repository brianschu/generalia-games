name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          mkdir -p _site/assets
          curl --fail --show-error --location --retry 3 \
            --output _site/assets/new_guinea_web_material.glb \
            https://github.com/brianschu/generalia-games/releases/download/echidna-terrain-v50/new_guinea_web_material.glb
          echo "7211194f6b36b2bd5b072c787fb1db2d786195f376d961e16a4095359d0ee221  _site/assets/new_guinea_web_material.glb" | sha256sum --check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
